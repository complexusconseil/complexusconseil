<style>
  :root{
    --bg:#0f2c3d;--bg2:#173D54;--card:#ffffff;--ink:#12222c;--muted:#5f6f7a;--line:#e5e9ee;
    --accent:#004BAD;--accent2:#0a6fe0;--good:#10b981;--good-bg:#e7f8f1;--bad:#ef4444;--bad-bg:#fdecec;--gold:#f5b301;
    --font-d:'Montserrat',-apple-system,'Segoe UI',sans-serif;--font-b:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-b);color:var(--ink);background:linear-gradient(160deg,#0f2c3d 0%,#173D54 55%,#0d2532 100%);background-attachment:fixed;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* langue */
  .langbar{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
  .lang{border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#e9f1f8;font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
  .lang[aria-pressed="true"]{background:#fff;color:var(--accent);border-color:#fff}
  .brand{color:#cfe0ec;font-family:var(--font-d);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;text-align:center;margin-bottom:6px}
  .home-card{background:var(--card);border-radius:26px;padding:28px 24px;box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
  h1{font-family:var(--font-d);font-weight:800;font-size:32px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.02em}
  .lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 auto 22px;max-width:360px}
  .logo{width:70px;height:70px;border-radius:20px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 4px;box-shadow:0 10px 26px rgba(0,75,173,.4)}
  .logo svg{width:38px;height:38px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:var(--font-b);font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{width:100%;border:none;border-radius:16px;padding:17px;font-family:var(--font-d);font-weight:700;font-size:17px;cursor:pointer;transition:transform .1s,box-shadow .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 12px 26px rgba(0,75,173,.38)}
  .btn-ghost{background:#eef2f6;color:var(--ink)}
  .stat-line{margin-top:16px;color:#9fb3c2;font-size:12.5px;text-align:center}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .progress{flex:1;height:9px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffd24d);border-radius:99px;transition:width .4s ease}
  .pill{background:rgba(255,255,255,.14);color:#eaf2f8;font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .pill.score{background:rgba(245,179,1,.2);color:#ffd875}
  .qcard{background:var(--card);border-radius:24px;padding:24px 20px 20px;box-shadow:0 22px 55px rgba(0,0,0,.32)}
  .cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-d);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:#eaf1fb;padding:6px 11px;border-radius:99px;margin-bottom:16px}
  .qnum{color:#a7b7c2;font-weight:600;font-size:13px;float:right;margin-top:5px}
  .question{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.28;margin:0 0 20px;letter-spacing:-.01em}
  .answers{display:flex;flex-direction:column;gap:11px}
  .ans{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:15px;font-family:var(--font-b);font-weight:500;font-size:16px;color:var(--ink);cursor:pointer;transition:.15s;line-height:1.3}
  .ans:active{transform:scale(.99)}
  .ans .key{flex:0 0 27px;height:27px;border-radius:8px;background:#eef2f6;color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ans.correct{border-color:var(--good);background:var(--good-bg)}
  .ans.correct .key{background:var(--good);color:#fff}
  .ans.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .ans.wrong .key{background:var(--bad);color:#fff}
  .ans.dim{opacity:.5}
  .ans[disabled]{cursor:default}
  .feedback{margin-top:16px;min-height:20px;font-size:14.5px;line-height:1.45;color:var(--muted)}
  .feedback b{color:var(--ink)}
  .next{margin-top:16px}
  .next[hidden]{display:none}
  .result-card{background:var(--card);border-radius:26px;padding:32px 24px;box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
  .score-big{font-family:var(--font-d);font-weight:800;font-size:52px;line-height:1;color:var(--accent);letter-spacing:-.02em}
  .score-sub{color:var(--muted);font-size:15px;margin:6px 0 20px}
  .grade{font-family:var(--font-d);font-weight:800;font-size:22px;margin-bottom:6px}
  .medal{font-size:56px;line-height:1;margin-bottom:8px}
  .rstats{display:flex;gap:10px;margin:20px 0}
  .rstat{flex:1;background:#f4f7f9;border-radius:16px;padding:14px 8px}
  .rstat .n{font-family:var(--font-d);font-weight:800;font-size:22px}
  .rstat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .foot{color:#9fb3c2;font-size:11.5px;text-align:center;margin-top:16px}
  .foot a{color:#cfe0ec}
  @media(max-width:360px){h1{font-size:28px}.question{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">

  <section class="screen" id="home">
    <div class="langbar" id="langbar">
      <button class="lang" data-lang="fr">🇫🇷 FR</button>
      <button class="lang" data-lang="en">🇬🇧 EN</button>
      <button class="lang" data-lang="ru">🇷🇺 RU</button>

    <div class="home-card">

      <h1 id="t_title"></h1>
      <p class="lead" id="t_lead"></p>
      <div class="field">
        <label id="t_themeLabel"></label>
        <div class="chips" id="cats"></div>
      </div>

        <label id="t_lenLabel"></label>

          <button class="chip" data-len="20" aria-pressed="false"></button>
          <button class="chip" data-len="0" aria-pressed="false"></button>
        </div>
      </div>
      <button class="btn btn-primary" id="startBtn"></button>
      <p class="stat-line" id="bankInfo"></p>
    </div>
  </section>

  <section class="screen" id="game" hidden>
    <div class="topbar">
      <button class="pill" id="quitBtn" style="cursor:pointer">✕</button>
      <div class="progress"><span id="bar"></span></div>
      <div class="pill" id="streakPill">🔥 <span id="streak">0</span></div>

    <div class="qcard">

      <span class="qnum" id="qnum"></span>
      <h2 class="question" id="qtext"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-primary next" id="nextBtn" hidden></button>
    </div>
  </section>

  <section class="screen" id="result" hidden>
    <div class="result-card">
      <div class="medal" id="medal">🎉</div>
      <div class="grade" id="grade"></div>
      <div class="score-big"><span id="rScore">0</span></div>
      <div class="score-sub"><span id="rPct">0</span><span id="t_pct"></span></div>
      <div class="rstats">
        <div class="rstat"><div class="n" id="rGood" style="color:var(--good)">0</div><div class="l" id="t_good"></div></div>
        <div class="rstat"><div class="n" id="rBad" style="color:var(--bad)">0</div><div class="l" id="t_bad"></div></div>
        <div class="rstat"><div class="n" id="rBest" style="color:var(--gold)">0</div><div class="l" id="t_best"></div></div>
      </div>
      <button class="btn btn-primary" id="againBtn" style="margin-bottom:10px"></button>
      <button class="btn btn-ghost" id="menuBtn"></button>
      <p class="foot"><span id="t_record"></span> <b id="record">0</b> ⭐ · <a href="index.html">Complexus Conseil</a></p>
    </div>
  </section>

</div>

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const KEYS = ["A","B","C","D"];
let LANG = "fr";
let state = {};

const TOTAL = THEMES.reduce((n,t)=>n+t.items.length,0);

function detectLang(){
  try{ const s=localStorage.getItem("quiz_lang"); if(s&&UI[s]) return s; }catch(e){}
  const n=(navigator.language||"fr").slice(0,2).toLowerCase();
  return UI[n]?n:"fr";
}

function applyLang(){
  const u=UI[LANG];
  document.documentElement.lang=LANG;
  $("#t_title").textContent=u.title;
  $("#t_lead").textContent=u.lead;
  $("#t_themeLabel").textContent=u.theme;
  $("#t_lenLabel").textContent=u.len;
  const lc=$("#lens").children;
  lc[0].textContent=u.q10; lc[1].textContent=u.q20; lc[2].textContent=u.qinf;
  $("#startBtn").textContent=u.start;
  $("#bankInfo").textContent=u.bank(TOTAL,THEMES.length);
  $("#t_pct").textContent=u.pct;
  $("#t_good").textContent=u.good;
  $("#t_bad").textContent=u.bad;
  $("#t_best").textContent=u.best;
  $("#againBtn").textContent=u.again;
  $("#menuBtn").textContent=u.menu;
  $("#t_record").textContent=u.record;
  $("#langbar").querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG?"true":"false"));
  buildCats();
}

function buildCats(){
  const box=$("#cats");
  const prev=box.querySelector('[aria-pressed="true"]');
  const prevId=prev?prev.dataset.cat:"__all__";
  box.innerHTML="";
  const mix=document.createElement("button");
  mix.className="chip"; mix.textContent=UI[LANG].mix; mix.dataset.cat="__all__";
  mix.setAttribute("aria-pressed", prevId==="__all__"?"true":"false");
  box.appendChild(mix);
  THEMES.forEach(t=>{
    const b=document.createElement("button");
    b.className="chip"; b.dataset.cat=t.id;
    b.textContent=`${t.icon} ${t.label[LANG]}`;
    b.setAttribute("aria-pressed", prevId===t.id?"true":"false");
    box.appendChild(b);
  });
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
    c.setAttribute("aria-pressed","true");
  });
}

function getSel(box){ return box.querySelector('[aria-pressed="true"]'); }

function buildDeck(catId){
  let list=[];
  const add=t=>t.items.forEach(it=>list.push({item:it,theme:t}));
  if(catId==="__all__") THEMES.forEach(add);
  else { const t=THEMES.find(x=>x.id===catId); if(t) add(t); }
  return shuffle(list);
}

function startGame(){
  const catId=getSel($("#cats")).dataset.cat;
  const len=parseInt(getSel($("#lens")).dataset.len,10);
  const deck=buildDeck(catId);
  state={deck,catId,len:len===0?deck.length:Math.min(len,deck.length),infinite:len===0,i:0,score:0,good:0,bad:0,streak:0,best:0};
  show("game"); render();
}

function show(id){ ["home","game","result"].forEach(s=>$("#"+s).hidden=s!==id); }

function render(){
  const {item,theme}=state.deck[state.i];
  const L=item[LANG]||item.fr;
  $("#qcat").textContent=`${theme.icon} ${theme.label[LANG]}`;
  $("#qnum").textContent=state.infinite?`#${state.i+1}`:`${state.i+1}/${state.len}`;
  $("#qtext").textContent=L.q;
  $("#score").textContent=state.score;
  $("#streak").textContent=state.streak;
  $("#bar").style.width=state.infinite?"100%":`${(state.i/state.len)*100}%`;
  $("#feedback").textContent="";
  $("#nextBtn").hidden=true;

  const correctText=L.a[item.c];
  const opts=L.a.map(text=>({text,correct:text===correctText}));
  shuffle(opts);
  const box=$("#answers"); box.innerHTML="";
  opts.forEach((o,idx)=>{
    const btn=document.createElement("button");
    btn.className="ans";
    const k=document.createElement("span"); k.className="key"; k.textContent=KEYS[idx];
    const t=document.createElement("span"); t.textContent=o.text;
    btn.appendChild(k); btn.appendChild(t);
    btn.onclick=()=>choose(btn,o.correct,box,L,correctText);
    box.appendChild(btn);
  });
}

function choose(btn,correct,box,L,correctText){
  [...box.children].forEach(b=>{b.disabled=true;b.onclick=null;});
  const u=UI[LANG];
  if(correct){
    btn.classList.add("correct");
    state.score+=10+Math.min(state.streak,5)*2;
    state.good++; state.streak++; state.best=Math.max(state.best,state.streak);
    $("#feedback").innerHTML=`✅ <b>${u.correct}</b> ${L.e||""}`;
    $("#feedback").style.color="var(--good)";
  } else {
    btn.classList.add("wrong");
    state.bad++; state.streak=0;
    [...box.children].forEach(b=>{
      const txt=b.querySelector("span:last-child").textContent;
      if(txt===correctText) b.classList.add("correct");
      else if(b!==btn) b.classList.add("dim");
    });
    $("#feedback").innerHTML=`❌ <b>${u.wrong}</b> ${L.e||""}`;
    $("#feedback").style.color="var(--ink)";
  }
  $("#score").textContent=state.score;
  $("#streak").textContent=state.streak;
  if(navigator.vibrate) navigator.vibrate(correct?18:[10,40,10]);

  const last=!state.infinite && state.i+1>=state.len;
  const nx=$("#nextBtn");
  nx.textContent=last?u.seeResults:u.next;
  nx.hidden=false;
  nx.onclick=()=>{
    state.i++;
    if(state.infinite && state.i>=state.deck.length){ state.deck=buildDeck(state.catId); state.i=0; }
    if(last) endGame(); else render();
  };
}

function endGame(){
  show("result");
  const u=UI[LANG];
  const answered=state.good+state.bad;
  const pct=answered?Math.round(state.good/answered*100):0;
  $("#rScore").textContent=state.score;
  $("#rPct").textContent=pct;
  $("#rGood").textContent=state.good;
  $("#rBad").textContent=state.bad;
  $("#rBest").textContent=state.best;
  let medal,grade;
  if(pct>=90){medal="🏆";grade=u.grades.genius;}
  else if(pct>=70){medal="🥇";grade=u.grades.exc;}
  else if(pct>=50){medal="🥈";grade=u.grades.good;}
  else if(pct>=30){medal="🥉";grade=u.grades.soso;}
  else {medal="📚";grade=u.grades.bad;}
  $("#medal").textContent=medal; $("#grade").textContent=grade;
  let rec=0; try{rec=parseInt(localStorage.getItem("quiz_record")||"0",10);}catch(e){}
  if(state.score>rec){rec=state.score; try{localStorage.setItem("quiz_record",rec);}catch(e){}}
  $("#record").textContent=rec;
}

/* events */
$("#langbar").querySelectorAll(".lang").forEach(b=>b.onclick=()=>{
  LANG=b.dataset.lang; try{localStorage.setItem("quiz_lang",LANG);}catch(e){}
  applyLang();
});
$("#startBtn").onclick=startGame;
$("#againBtn").onclick=startGame;
$("#menuBtn").onclick=()=>show("home");
$("#quitBtn").onclick=()=>{ if(state.good+state.bad>0) endGame(); else show("home"); };

/* init */
LANG=detectLang();
applyLang();
try{ const r=parseInt(localStorage.getItem("quiz_record")||"0",10); if(r>0) $("#record").textContent=r; }catch(e){}
</script>
</body>
</html>
