<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173D54">
<title>Quiz Complexus — Trivia culture générale</title>
<meta name="description" content="Quiz de culture générale à jouer directement depuis votre téléphone. Des centaines de questions variées, une interface simple.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23173D54'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='%23fff' font-family='Arial'%3E%3F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f2c3d;
    --bg2:#173D54;
    --card:#ffffff;
    --ink:#12222c;
    --muted:#5f6f7a;
    --line:#e5e9ee;
    --accent:#004BAD;
    --accent2:#0a6fe0;
    --good:#10b981;
    --good-bg:#e7f8f1;
    --bad:#ef4444;
    --bad-bg:#fdecec;
    --gold:#f5b301;
    --font-d:'Montserrat',-apple-system,'Segoe UI',sans-serif;
    --font-b:'Inter',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-b);
    color:var(--ink);
    background:linear-gradient(160deg,#0f2c3d 0%,#173D54 55%,#0d2532 100%);
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:560px;margin:0 auto;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));
  }
  .screen{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- Accueil ---------- */
  .brand{color:#cfe0ec;font-family:var(--font-d);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;text-align:center;margin-bottom:6px}
  .home-card{background:var(--card);border-radius:26px;padding:30px 24px;box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
  h1{font-family:var(--font-d);font-weight:800;font-size:34px;line-height:1.08;margin:6px 0 8px;letter-spacing:-.02em}
  .lead{color:var(--muted);font-size:15px;line-height:1.5;margin:0 auto 22px;max-width:340px}
  .logo{width:74px;height:74px;border-radius:20px;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 4px;box-shadow:0 10px 26px rgba(0,75,173,.4)}
  .logo svg{width:40px;height:40px}
  .field{text-align:left;margin-bottom:18px}
  .field label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:var(--font-b);font-weight:600;font-size:14px;padding:9px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn{width:100%;border:none;border-radius:16px;padding:17px;font-family:var(--font-d);font-weight:700;font-size:17px;cursor:pointer;transition:transform .1s,box-shadow .2s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 12px 26px rgba(0,75,173,.38)}
  .btn-ghost{background:#eef2f6;color:var(--ink)}
  .stat-line{margin-top:16px;color:#9fb3c2;font-size:12.5px;text-align:center}

  /* ---------- Jeu ---------- */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .progress{flex:1;height:9px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
  .progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffd24d);border-radius:99px;transition:width .4s ease}
  .pill{background:rgba(255,255,255,.14);color:#eaf2f8;font-weight:700;font-size:13px;padding:6px 11px;border-radius:99px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .pill.score{background:rgba(245,179,1,.2);color:#ffd875}
  .qcard{background:var(--card);border-radius:24px;padding:24px 20px 20px;box-shadow:0 22px 55px rgba(0,0,0,.32)}
  .cat{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-d);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:#eaf1fb;padding:6px 11px;border-radius:99px;margin-bottom:16px}
  .qnum{color:#a7b7c2;font-weight:600;font-size:13px;float:right;margin-top:5px}
  .question{font-family:var(--font-d);font-weight:700;font-size:22px;line-height:1.28;margin:0 0 20px;letter-spacing:-.01em}
  .answers{display:flex;flex-direction:column;gap:11px}
  .ans{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:15px 15px;font-family:var(--font-b);font-weight:500;font-size:16px;color:var(--ink);cursor:pointer;transition:.15s;line-height:1.3}
  .ans:active{transform:scale(.99)}
  .ans .key{flex:0 0 27px;height:27px;border-radius:8px;background:#eef2f6;color:var(--muted);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .ans.correct{border-color:var(--good);background:var(--good-bg)}
  .ans.correct .key{background:var(--good);color:#fff}
  .ans.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .ans.wrong .key{background:var(--bad);color:#fff}
  .ans.dim{opacity:.5}
  .ans[disabled]{cursor:default}
  .feedback{margin-top:16px;min-height:20px;font-size:14.5px;line-height:1.45;color:var(--muted)}
  .feedback b{color:var(--ink)}
  .next{margin-top:16px}
  .next[hidden]{display:none}

  /* ---------- Résultats ---------- */
  .result-card{background:var(--card);border-radius:26px;padding:32px 24px;box-shadow:0 22px 60px rgba(0,0,0,.35);text-align:center}
  .score-big{font-family:var(--font-d);font-weight:800;font-size:52px;line-height:1;color:var(--accent);letter-spacing:-.02em}
  .score-sub{color:var(--muted);font-size:15px;margin:6px 0 20px}
  .grade{font-family:var(--font-d);font-weight:800;font-size:22px;margin-bottom:6px}
  .medal{font-size:56px;line-height:1;margin-bottom:8px}
  .rstats{display:flex;gap:10px;margin:20px 0}
  .rstat{flex:1;background:#f4f7f9;border-radius:16px;padding:14px 8px}
  .rstat .n{font-family:var(--font-d);font-weight:800;font-size:22px}
  .rstat .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .foot{color:#9fb3c2;font-size:11.5px;text-align:center;margin-top:16px}
  .foot a{color:#cfe0ec}
  @media(max-width:360px){h1{font-size:29px}.question{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ACCUEIL -->
  <section class="screen" id="home">
    <p class="brand">Complexus&nbsp;·&nbsp;Quiz</p>
    <div class="home-card">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M9.1 9a3 3 0 1 1 4.2 2.7c-.9.4-1.3 1-1.3 2v.3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.5" r="1.4" fill="#fff"/></svg></div>
      <h1>Quiz culture&nbsp;générale</h1>
      <p class="lead">Des centaines de questions variées. Choisissez un thème et enchaînez les manches. Parfait pour passer le temps.</p>

      <div class="field">
        <label>Thème</label>
        <div class="chips" id="cats"></div>
      </div>
      <div class="field">
        <label>Longueur de la manche</label>
        <div class="chips" id="lens">
          <button class="chip" data-len="10" aria-pressed="true">10 questions</button>
          <button class="chip" data-len="20" aria-pressed="false">20 questions</button>
          <button class="chip" data-len="0" aria-pressed="false">Infini ∞</button>
        </div>
      </div>

      <button class="btn btn-primary" id="startBtn">Commencer&nbsp;→</button>
      <p class="stat-line" id="bankInfo"></p>
    </div>
  </section>

  <!-- JEU -->
  <section class="screen" id="game" hidden>
    <div class="topbar">
      <button class="pill" id="quitBtn" style="cursor:pointer">✕</button>
      <div class="progress"><span id="bar"></span></div>
      <div class="pill" id="streakPill">🔥 <span id="streak">0</span></div>
      <div class="pill score">⭐ <span id="score">0</span></div>
    </div>
    <div class="qcard">
      <span class="cat" id="qcat">Général</span>
      <span class="qnum" id="qnum"></span>
      <h2 class="question" id="qtext"></h2>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn btn-primary next" id="nextBtn" hidden>Question suivante →</button>
    </div>
  </section>

  <!-- RÉSULTATS -->
  <section class="screen" id="result" hidden>
    <div class="result-card">
      <div class="medal" id="medal">🎉</div>
      <div class="grade" id="grade"></div>
      <div class="score-big"><span id="rScore">0</span></div>
      <div class="score-sub"><span id="rPct">0</span>% de bonnes réponses</div>
      <div class="rstats">
        <div class="rstat"><div class="n" id="rGood" style="color:var(--good)">0</div><div class="l">Correctes</div></div>
        <div class="rstat"><div class="n" id="rBad" style="color:var(--bad)">0</div><div class="l">Erreurs</div></div>
        <div class="rstat"><div class="n" id="rBest" style="color:var(--gold)">0</div><div class="l">Meilleure série</div></div>
      </div>
      <button class="btn btn-primary" id="againBtn" style="margin-bottom:10px">Rejouer&nbsp;↻</button>
      <button class="btn btn-ghost" id="menuBtn">Changer de thème</button>
      <p class="foot">Record personnel : <b id="record">0</b> ⭐ · <a href="index.html">Complexus Conseil</a></p>
    </div>
  </section>

</div>

<script>

/* ================= LOGIQUE ================= */
const $ = s => document.querySelector(s);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const KEYS = ["A","B","C","D"];
const CAT_ICON = {"Histoire":"🏛️","Géographie":"🌍","Sciences":"🔬","Sport":"⚽","Cinéma & séries":"🎬","Musique":"🎵","Arts & littérature":"🎨","Nature & animaux":"🐾","Technologie & IA":"💻","Culture générale":"💡","Gastronomie":"🍽️"};

let state = {};

// total questions
const TOTAL = Object.values(BANK).reduce((n,a)=>n+a.length,0);
$("#bankInfo").textContent = `${TOTAL} questions · ${Object.keys(BANK).length} thèmes`;

// build category chips
const catBox = $("#cats");
["Mélange 🎲", ...Object.keys(BANK)].forEach((name,i)=>{
  const b=document.createElement("button");
  b.className="chip"; b.textContent = i===0 ? name : `${CAT_ICON[name]||""} ${name}`;
  b.dataset.cat = i===0 ? "__all__" : name;
  b.setAttribute("aria-pressed", i===0 ? "true":"false");
  b.onclick=()=>{ catBox.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); };
  catBox.appendChild(b);
});
// length chips
$("#lens").querySelectorAll(".chip").forEach(b=>{
  b.onclick=()=>{ $("#lens").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); };
});

function getSelected(box){ return box.querySelector('[aria-pressed="true"]'); }

function buildDeck(cat){
  let list=[];
  if(cat==="__all__"){ Object.entries(BANK).forEach(([k,arr])=>arr.forEach(q=>list.push({...q,cat:k}))); }
  else { BANK[cat].forEach(q=>list.push({...q,cat})); }
  return shuffle(list);
}

function startGame(){
  const cat = getSelected(catBox).dataset.cat;
  const len = parseInt(getSelected($("#lens")).dataset.len,10);
  const deck = buildDeck(cat);
  state = { deck, len: len===0?deck.length:Math.min(len,deck.length), infinite: len===0,
            i:0, score:0, good:0, bad:0, streak:0, best:0 };
  show("game"); render();
}

function show(id){ ["home","game","result"].forEach(s=>$("#"+s).hidden = s!==id); }

function render(){
  const q = state.deck[state.i];
  $("#qcat").textContent = `${CAT_ICON[q.cat]||"💡"} ${q.cat}`;
  $("#qnum").textContent = state.infinite ? `#${state.i+1}` : `${state.i+1}/${state.len}`;
  $("#qtext").textContent = q.q;
  $("#score").textContent = state.score;
  $("#streak").textContent = state.streak;
  $("#bar").style.width = state.infinite ? "100%" : `${(state.i/state.len)*100}%`;
  $("#feedback").textContent = "";
  $("#feedback").style.color = "var(--muted)";
  $("#nextBtn").hidden = true;

  // prepare shuffled answers keeping track of correct
  const opts = q.a.map((text,idx)=>({text,correct:idx===q.c}));
  shuffle(opts);
  const box = $("#answers"); box.innerHTML="";
  opts.forEach((o,idx)=>{
    const btn=document.createElement("button");
    btn.className="ans";
    btn.innerHTML=`<span class="key">${KEYS[idx]}</span><span>${o.text}</span>`;
    btn.onclick=()=>choose(btn,o.correct,box,q);
    box.appendChild(btn);
  });
}

function choose(btn,correct,box,q){
  [...box.children].forEach(b=>{ b.disabled=true; b.onclick=null; });
  if(correct){
    btn.classList.add("correct");
    state.score += 10 + Math.min(state.streak,5)*2; // bonus série
    state.good++; state.streak++; state.best=Math.max(state.best,state.streak);
    $("#feedback").innerHTML = `✅ <b>Bonne réponse !</b> ${q.e||""}`;
    $("#feedback").style.color = "var(--good)";
  } else {
    btn.classList.add("wrong");
    state.bad++; state.streak=0;
    // reveal correct
    [...box.children].forEach(b=>{ if(b.querySelector("span:last-child").textContent===q.a[q.c]) b.classList.add("correct"); else if(b!==btn) b.classList.add("dim"); });
    $("#feedback").innerHTML = `❌ <b>Raté.</b> ${q.e||""}`;
    $("#feedback").style.color = "var(--ink)";
  }
  $("#score").textContent = state.score;
  $("#streak").textContent = state.streak;
  if(navigator.vibrate) navigator.vibrate(correct?18:[10,40,10]);

  const last = !state.infinite && state.i+1>=state.len;
  const btnNext=$("#nextBtn");
  btnNext.textContent = last ? "Voir mes résultats →" : "Question suivante →";
  btnNext.hidden=false;
  btnNext.onclick=()=>{
    state.i++;
    if(state.infinite && state.i>=state.deck.length){ state.deck=buildDeck(getSelected(catBox).dataset.cat); state.i=0; }
    if(last) endGame(); else render();
  };
}

function endGame(){
  show("result");
  const answered = state.good+state.bad;
  const pct = answered? Math.round(state.good/answered*100):0;
  $("#rScore").textContent = state.score;
  $("#rPct").textContent = pct;
  $("#rGood").textContent = state.good;
  $("#rBad").textContent = state.bad;
  $("#rBest").textContent = state.best;
  let medal="🎯", grade="Pas mal !";
  if(pct>=90){medal="🏆";grade="Génie de la culture G !";}
  else if(pct>=70){medal="🥇";grade="Excellent !";}
  else if(pct>=50){medal="🥈";grade="Bien joué !";}
  else if(pct>=30){medal="🥉";grade="Ça vient…";}
  else {medal="📚";grade="À réviser !";}
  $("#medal").textContent=medal; $("#grade").textContent=grade;
  // record
  let rec = 0; try{ rec = parseInt(localStorage.getItem("quiz_record")||"0",10);}catch(e){}
  if(state.score>rec){ rec=state.score; try{localStorage.setItem("quiz_record",rec);}catch(e){} }
  $("#record").textContent = rec;
}

// events
$("#startBtn").onclick = startGame;
$("#againBtn").onclick = startGame;
$("#menuBtn").onclick = ()=>show("home");
$("#quitBtn").onclick = ()=>{ if(state.good+state.bad>0) endGame(); else show("home"); };

// show record on home if exists
try{ const r=parseInt(localStorage.getItem("quiz_record")||"0",10); if(r>0) $("#record").textContent=r; }catch(e){}
</script>
</body>
</html>
